<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>OpenRouter Chat</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="topbar-title" id="topbarTitle">Novo chat</div>
  <button id="newChatBtnTop" class="icon-btn" aria-label="Novo chat">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>
</header>

<div id="drawerOverlay" class="overlay"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-header">
    <div class="drawer-logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <span class="drawer-title">OpenRouter Chat</span>
  </div>

  <button id="newChatBtn" class="drawer-new-chat">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Novo chat
  </button>

  <div class="drawer-section-title">Conversas</div>
  <div id="chatsList" class="chats-list"></div>

  <div class="drawer-footer">
    <button id="settingsBtn" class="drawer-footer-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Configurações
    </button>
  </div>
</aside>

<main class="chat">
  <div id="messages" class="messages"></div>

  <form id="chatForm" class="composer">
    <div id="filePreview" class="file-preview"></div>
    <div class="composer-row">
      <label for="fileInput" class="attach-btn" title="Anexar arquivo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </label>
      <input type="file" id="fileInput" multiple
        accept="image/*,video/*,audio/*,.pdf,.txt,.md,.json,.csv,.xml,.yaml,.yml,.html,.css,.js,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.h,.hpp,.cs,.rb,.php,.go,.rs,.sh,.bash,.sql,.kt,.swift,.lua,.r,.m,.pl,.ms,.mscript,.micro,.mini,.mins,.gs,.nut,.gd,.luau,.as,.docx,.xlsx,.pptx,.doc,.xls,.zip,.log,.ini,.conf,.env,.gitignore,.dockerfile"
        hidden />
      <textarea id="userInput" placeholder="Mensagem para o OpenRouter..." rows="1"></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div id="currentModelInfo" class="current-model-info"></div>
  </form>
</main>

<div id="settingsOverlay" class="overlay"></div>
<section id="settingsPanel" class="settings-panel">
  <div class="settings-header">
    <h2>Configurações</h2>
    <button id="closeSettingsBtn" class="icon-btn" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="settings-body">
    <div class="settings-field">
      <label for="userName">Seu nome</label>
      <input type="text" id="userName" placeholder="Ex: seu nome" />
    </div>

    <div class="settings-field">
      <label for="apiKey">API Key do OpenRouter</label>
      <div class="input-with-btn">
        <input type="password" id="apiKey" placeholder="sk-or-v1-..." />
        <button id="saveKeyBtn" class="btn small">Salvar</button>
      </div>
    </div>

    <div class="settings-field">
      <label for="modelSelect">Modelo</label>
      <select id="modelSelect">
        <option value="openrouter/free">🆓 Roteador Automático de Grátis</option>
      </select>

      <label class="checkbox-row">
        <input type="checkbox" id="onlyFree" checked />
        <span>🆓 Apenas modelos gratuitos</span>
      </label>

      <div class="btn-row">
        <button id="loadModelsBtn" class="btn small">Carregar modelos</button>
      </div>
      <div id="modelsInfo" class="models-info"></div>
    </div>

    <div class="settings-field">
      <label>📊 Meus usos</label>
      <div class="stats">
        <div class="stat-row"><span>Requisições:</span><b id="statReqs">0</b></div>
        <div class="stat-row"><span>Tokens entrada:</span><b id="statIn">0</b></div>
        <div class="stat-row"><span>Tokens saída:</span><b id="statOut">0</b></div>
        <div class="stat-row"><span>Total tokens:</span><b id="statTotal">0</b></div>
        <div class="stat-row"><span>Custo (USD):</span><b id="statCost">0.000000</b></div>

        <h4>Modelos usados</h4>
        <ul id="modelUsage" class="model-usage"></ul>

        <button id="resetStatsBtn" class="btn small">Zerar estatísticas</button>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
        </html>
